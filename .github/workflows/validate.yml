# Guards the mirror: no binaries tracked, docs stay consistent.
# No builds run here; releases are mirrored by hand (see docs/MIRRORING.md).
name: Validate mirror

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No binaries tracked in git
        run: |
          tracked=$(git ls-files | grep -Ei '\.(apk|exe|bin|tar|gz|sqlite)$|DashMapOfflineMaps-' || true)
          if [ -n "$tracked" ]; then
            echo "FAIL: release binaries must live on Releases, never in git:"
            echo "$tracked"
            exit 1
          fi
          echo "no tracked binaries - ok"
