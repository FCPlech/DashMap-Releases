# Guards the mirror: markdown syntax + script compile + no binaries tracked.
# No builds run here; releases arrive via scripts/mirror_release.py.
name: Validate mirror

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Script syntax
        run: |
          python3 -m py_compile scripts/mirror_release.py
          echo "script compiles ok"

      - name: No binaries tracked in git
        run: |
          tracked=$(git ls-files | grep -Ei '\.(apk|exe|bin|tar|gz|sqlite)$|DashMapOfflineMaps-' || true)
          if [ -n "$tracked" ]; then
            echo "FAIL: release binaries must live on Releases, never in git:"
            echo "$tracked"
            exit 1
          fi
          echo "no tracked binaries - ok"
